# Đăng ứng dụng quét tài liệu (thư mục public/) lên GitHub Pages.
# Ứng dụng chạy hoàn toàn trên trình duyệt nên chỉ cần web tĩnh có HTTPS —
# đủ để cài lên iPhone ("Thêm vào Màn hình chính") và dùng camera.
# Mỗi lần public/ trên main thay đổi, nội dung được chép sang nhánh gh-pages
# (nhánh GitHub Pages phục vụ tại https://huy56xf.github.io/image-filter-starter-code/).
name: Deploy scanner to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish public/ to gh-pages
        run: |
          cd public
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
